name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # pinned, ubuntu-latest moved to 26.04 which has no python 3.9 build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # one version failing to set up shouldn't cancel the rest
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -v
